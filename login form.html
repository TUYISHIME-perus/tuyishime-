<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#667eea,#764ba2);
    }

    .login-box{
      width:350px;
      background:#fff;
      padding:30px;
      border-radius:12px;
      box-shadow:0 5px 20px rgba(0,0,0,0.3);
    }

    .login-box h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .input-box{
      margin-bottom:18px;
    }

    .input-box label{
      display:block;
      margin-bottom:6px;
      font-weight:bold;
      color:#444;
    }

    .input-box input{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      outline:none;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:#667eea;
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
      font-size:14px;
    }

    .options a{
      text-decoration:none;
      color:#667eea;
    }

    .options a:hover{
      text-decoration:underline;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      background:#667eea;
      color:white;
      font-size:16px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#5563d6;
    }

    .message{
      margin-top:15px;
      text-align:center;
      color:green;
      display:none;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login Form</h2>

    <form id="loginForm">

      <div class="input-box">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="options">
        <label>
          <input type="checkbox"> Remember Me
        </label>

        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit">Login</button>

      <div class="message" id="message">
        Login Successful!
      </div>

    </form>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", function(e){
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if(email === "" || password === ""){
        alert("Please fill all fields");
        return;
      }

      message.style.display = "block";

      setTimeout(() => {
        message.style.display = "none";
      }, 3000);

      loginForm.reset();
    });
  </script>

</body>
</html>
