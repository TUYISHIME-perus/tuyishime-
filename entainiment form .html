<!DOCTYPE html>
<html>
<head>
    <title>Entertainment Form</title>

    <style>
        body{
            font-family: Arial;
            background: #f0f0f0;
        }

        .form-box{
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2{
            text-align: center;
            color: darkblue;
        }

        input, select, textarea{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 100%;
            padding: 10px;
            background: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: blue;
        }
    </style>
</head>

<body>

<div class="form-box">
    <h2>Entertainment Form</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Favorite Entertainment</label>
        <select>
            <option>Music</option>
            <option>Movies</option>
            <option>Games</option>
            <option>Sports</option>
        </select>

        <label>Comments</label>
        <textarea rows="4" placeholder="Write here..."></textarea>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
